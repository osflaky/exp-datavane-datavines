name: Backend

on:
  workflow_dispatch:

concurrency:
  group: backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  paths-filter:
    name: Backend-Path-Filter
    runs-on: ubuntu-latest
    outputs:
      not-ignore: true
    steps:
    - uses: actions/checkout@v2
    - uses: dorny/paths-filter@b2feaf19c27470162a626bd6fa8438ae5b263721
      id: filter
      with:
        filters: |
          not-ignore:
            - '!(docs/**)'
  build:
    name: Backend-Build [${{ matrix.expander_leg }}]
    needs: paths-filter
    if: ${{ (needs.paths-filter.outputs.not-ignore == 'true') || 
      (github.event_name == 'push') }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - java: 11
          os: macos-latest
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest-11-arm64
    timeout-minutes: 30
    steps:
    - name: Keep LF line endings on checkout
      run: git config --global core.autocrlf false
    - uses: actions/checkout@v2
      with:
        submodules: true
      # No vendor publishes a native Windows ARM64 JDK 8 build, so on the
      # windows-11-arm runner install the x64 JDK. Windows 11 on ARM runs it
      # through its built-in x64 emulation, and the full build and tests still
      # run on that runner.
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v2
      with:
        java-version: ${{ matrix.java }}
        distribution: 'adopt'
        architecture: ${{ (matrix.arch == 'arm64' && matrix.os != 
          'windows-latest') && 'aarch64' || 'x64' }}
    - uses: actions/cache@v3
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven
    - name: Build and Package on ${{ matrix.java }}
      shell: bash
      run: |
        chmod 777 ./mvnw
        ./mvnw -B clean install \
               -Dspotless.skip=true \

